<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EP Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* EP Simulator — layout: an instrument console. A fixed index rail on the left, the ECG strip as the
   working surface, the heart model and notes alongside it. */
:root {
  --bg: #f1f3f5; --surface: #ffffff; --surface-2: #e8ecf0; --ink: #15202a; --muted: #586474; --line: #d3dae1;
  --accent: #0d6975; --accent-ink: #ffffff; --accent-soft: #d8ecee; --warn: #a85a12; --bad: #b3261e; --good: #1d7448; --gold: #a57a00;
  --ecg-paper: #fffaf6; --ecg-minor: #f5d9d4; --ecg-major: #e6aca4; --ecg-trace: #15191e; --ecg-label: #5a6472; --ecg-cursor: #0d6975; --ecg-caliper: #0b5fa5;
  --lad-fast: #2f6fb7; --lad-slow: #d9822b; --lad-ap: #b0308a; --lad-block: #c0392b; --lad-tier: #a0a8b3; --ecg-mark: #1d7448; --ecg-pulse: #b3261e;
  --h3d-a: #f4f6f8; --h3d-b: #d6dde4; --label-bg: rgba(255, 255, 255, 0.82); --shadow: 0 1px 2px rgba(20, 32, 44, 0.08);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1216; --surface: #151c22; --surface-2: #1d262e; --ink: #e6edf2; --muted: #98a6b3; --line: #2a3640;
    --accent: #5bc2cd; --accent-ink: #062428; --accent-soft: #14373c; --warn: #e3a05c; --bad: #f0857c; --good: #6fcf9a; --gold: #e2bd4d;
    --ecg-paper: #0e1418; --ecg-minor: #1a252c; --ecg-major: #2b3b45; --ecg-trace: #eaf2f6; --ecg-label: #93a2b0; --ecg-cursor: #5bc2cd; --ecg-caliper: #7fb8ee;
    --lad-fast: #6aa7ea; --lad-slow: #f0a95a; --lad-ap: #e07ac6; --lad-block: #f0857c; --lad-tier: #51606c; --ecg-mark: #6fcf9a; --ecg-pulse: #f0857c;
    --h3d-a: #1b242b; --h3d-b: #0f1519; --label-bg: rgba(16, 22, 27, 0.8); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1216; --surface: #151c22; --surface-2: #1d262e; --ink: #e6edf2; --muted: #98a6b3; --line: #2a3640;
  --accent: #5bc2cd; --accent-ink: #062428; --accent-soft: #14373c; --warn: #e3a05c; --bad: #f0857c; --good: #6fcf9a; --gold: #e2bd4d;
  --ecg-paper: #0e1418; --ecg-minor: #1a252c; --ecg-major: #2b3b45; --ecg-trace: #eaf2f6; --ecg-label: #93a2b0; --ecg-cursor: #5bc2cd; --ecg-caliper: #7fb8ee;
  --lad-fast: #6aa7ea; --lad-slow: #f0a95a; --lad-ap: #e07ac6; --lad-block: #f0857c; --lad-tier: #51606c; --ecg-mark: #6fcf9a; --ecg-pulse: #f0857c;
  --h3d-a: #1b242b; --h3d-b: #0f1519; --label-bg: rgba(16, 22, 27, 0.8); --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.005em; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---- top bar ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top-in { display: flex; align-items: stretch; gap: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 9px; padding-block: 10px; font: 600 15px/1 var(--cond); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.brand svg { display: block; }
.brand small { font: 400 11px/1 var(--mono); color: var(--muted); letter-spacing: 0; text-transform: none; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 0 11px; white-space: nowrap; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; min-height: 44px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.page { padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }
.boot { padding: 60px 0; text-align: center; color: var(--muted); }

/* ---- generic pieces ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.card-h h2, .card-h h3 { font-size: 14px; }
.card-b { padding: 12px; }
.eyebrow { font: 600 11px/1.2 var(--cond); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 5px 10px; cursor: pointer; min-height: 32px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 2px 8px; min-height: 28px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; cursor: pointer; min-height: 30px; border-right: 1px solid var(--line); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
select, input[type="number"], input[type="search"], input[type="text"] { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 4px 8px; min-height: 30px; max-width: 100%; }
input[type="range"] { accent-color: var(--accent); min-width: 80px; }
label.chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px; white-space: nowrap; }
label.fld { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font: 600 11px/1 var(--cond); letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 7px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(74px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.kv > div { background: var(--surface); padding: 6px 8px; }
.kv dt, .kv .k { font: 600 10px/1.2 var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.kv dd, .kv .v { margin: 2px 0 0; font: 500 15px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.kv .v small { font-size: 11px; color: var(--muted); font-weight: 400; }
.prose { max-width: 68ch; }
.prose p + p { margin-top: 0.7em; }
.prose ul { margin: 0.4em 0 0; padding-left: 1.15em; }
.prose li { margin: 0.28em 0; }
.prose h4 { font: 600 11px/1.2 var(--cond); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 1.1em 0 0.35em; }
.prose h4:first-child { margin-top: 0; }
.note { border-left: 3px solid var(--gold); background: color-mix(in srgb, var(--gold) 9%, transparent); padding: 8px 10px; border-radius: 0 4px 4px 0; font-size: 13px; }
.note.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, transparent); }
.note.good { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 9%, transparent); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
table.tbl th { text-align: left; font: 600 11px/1.2 var(--cond); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll-x { overflow-x: auto; }

/* ---- rhythm lab ---- */
.lab { display: grid; grid-template-columns: 236px minmax(0, 1fr) minmax(320px, 430px); gap: 14px; align-items: start; }
.lab.lab2 { grid-template-columns: 236px minmax(0, 1fr); }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); max-height: calc(100vh - 74px); overflow: auto; }
.rail input[type="search"] { width: 100%; }
.rail-g { font: 600 10.5px/1.2 var(--cond); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
.rail-i { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 10px; cursor: pointer; border-left: 2px solid transparent; line-height: 1.25; }
.rail-i small { display: block; color: var(--muted); font-size: 11.5px; }
.rail-i:hover { background: var(--surface-2); }
.rail-i[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-soft); }
.rail-sel { display: none; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); display: grid; gap: 14px; }
.stack { display: grid; gap: 14px; min-width: 0; }
.ecg-scroll { overflow-x: auto; background: var(--ecg-paper); border-radius: 0 0 6px 6px; }
.ecg-scroll canvas { display: block; touch-action: pan-x pan-y; cursor: crosshair; }
.transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.transport input[type="range"] { flex: 1; min-width: 120px; }
.h3d { position: relative; height: 400px; background: radial-gradient(ellipse at 50% 40%, var(--h3d-a), var(--h3d-b)); border-radius: 6px 6px 0 0; overflow: hidden; cursor: grab; }
.h3d:active { cursor: grabbing; }
.h3d-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.h3d-label { position: absolute; left: 0; top: 0; font: 600 10.5px/1.2 var(--cond); letter-spacing: 0.03em; color: var(--ink); background: var(--label-bg); padding: 2px 5px; border-radius: 3px; white-space: nowrap; }
.h3d-label.h3d-cs { color: var(--gold); }
.h3d-label.h3d-ves { font-weight: 500; color: var(--muted); }
.h3d-label.h3d-note { background: var(--accent); color: var(--accent-ink); }
.h3d-label.h3d-dev { background: var(--ink); color: var(--surface); }
.h3d-tools { display: grid; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.h3d-hint { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: var(--muted); pointer-events: none; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.legend i { display: block; height: 8px; flex: 1; border-radius: 4px; min-width: 60px; }
.lg-prop { background: linear-gradient(90deg, #fff7d0, #ffe14d 6%, #fc8020 22%, #cc3350 52%, #80337f 80%, #a8413b); }
.lg-iso { background: linear-gradient(90deg, #db1a1a, #f58019 18%, #f2e033 36%, #40bf4d 54%, #2699d9 72%, #3340cc 88%, #8026a6); }

@media (max-width: 1180px) {
  .lab { grid-template-columns: 210px minmax(0, 1fr); }
  .side { grid-column: 2; position: static; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
}
@media (max-width: 820px) {
  .lab, .lab.lab2 { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .rail-sel { display: block; width: 100%; }
  .side { grid-column: 1; }
  .h3d { height: 340px; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* ---- simulators (pacemaker, temporary pacing, ICD, cases) ---- */
.sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 14px; align-items: start; }
.sim-main { display: grid; gap: 14px; min-width: 0; }
.live { background: var(--ecg-paper); border-radius: 0 0 6px 6px; overflow: hidden; }
.live canvas { display: block; }
.ctl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.ctl label { color: var(--muted); }
.ctl input[type="range"] { width: 100%; grid-column: 1 / -1; margin: 0 0 6px; }
.ctl .val { font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
.ctl select { grid-column: 1 / -1; width: 100%; margin-bottom: 6px; }
.findings { display: grid; gap: 6px; }
.finding { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; }
.finding .pill { margin-top: 2px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 8px 10px; cursor: pointer; min-height: 40px; }
.opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.opt:disabled { cursor: default; opacity: 0.85; }
.dial { display: grid; gap: 2px; justify-items: center; }
.dial .num { font: 500 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.dial .unit { font-size: 11px; color: var(--muted); }
.box { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 12px; display: grid; gap: 12px; }
.box-lcd { background: #0f1a14; color: #7ef0a8; border-radius: 5px; padding: 8px 10px; font: 500 13px/1.5 var(--mono); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
.box-lcd b { display: block; font-size: 20px; }
.vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.vitals > div { background: var(--surface); padding: 6px 8px; }
.vitals .k { font: 600 10px/1.2 var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.vitals .v { font: 500 18px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.vitals .v.bad { color: var(--bad); }
@media (max-width: 980px) { .sim { grid-template-columns: minmax(0, 1fr); } }

/* ---- devices ---- */
.dev-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.xr { position: relative; background: #000; border-radius: 6px 6px 0 0; overflow: hidden; height: 400px; filter: contrast(1.12) brightness(1.04); }
.xr-marks span { position: absolute; color: #d6d6d6; font: 600 11px/1 var(--cond); letter-spacing: 0.08em; }
.variants { display: flex; flex-wrap: wrap; gap: 6px; }
.variants .btn.bad[aria-pressed="true"] { background: color-mix(in srgb, var(--bad) 14%, transparent); border-color: var(--bad); color: var(--bad); }
.signs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.signs > div { background: var(--surface); padding: 10px 12px; font-size: 13px; }
.signs h4 { font: 600 10.5px/1.2 var(--cond); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="34" height="18" viewBox="0 0 34 18" aria-hidden="true"><path d="M0 11h7l2-3 2 3h3l2-10 3 16 2-6h4l2-2 2 2h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      EP Simulator <small>12-lead · 3D map · devices</small>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Modules"></nav>
  </div>
</header>
<main class="page" id="page"><div class="boot">Building the heart model…</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---- js/util.js ---- */
/* EP Simulator — shared helpers. Plain script; everything hangs off globalThis.EP. */
(function (EP) {
  'use strict';

  const V = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    scale: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
    addS: (a, b, k) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: (a) => Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]),
    dist: (a, b) => Math.sqrt((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2),
    norm: (a) => { const l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
    lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  };
  EP.V = V;

  EP.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  EP.lerp = (a, b, t) => a + (b - a) * t;
  EP.smoothstep = (a, b, x) => { const t = EP.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  /* Deterministic RNG (mulberry32) so a given rhythm always looks the same. */
  EP.rng = function (seed) {
    let s = seed >>> 0;
    const f = function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.gauss = function () {
      let u = 0, v = 0;
      while (u === 0) u = f();
      v = f();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };
    f.range = (a, b) => a + (b - a) * f();
    return f;
  };

  /* Binary min-heap keyed by a Float32Array/Float64Array of priorities. */
  EP.Heap = function (capacity) {
    this.ids = new Int32Array(capacity);
    this.keys = new Float64Array(capacity);
    this.n = 0;
  };
  EP.Heap.prototype.push = function (id, key) {
    if (this.n >= this.ids.length) {
      const ni = new Int32Array(this.ids.length * 2); ni.set(this.ids); this.ids = ni;
      const nk = new Float64Array(this.keys.length * 2); nk.set(this.keys); this.keys = nk;
    }
    let i = this.n++;
    const ids = this.ids, keys = this.keys;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (keys[p] <= key) break;
      ids[i] = ids[p]; keys[i] = keys[p]; i = p;
    }
    ids[i] = id; keys[i] = key;
  };
  EP.Heap.prototype.pop = function () {
    const ids = this.ids, keys = this.keys;
    const top = ids[0];
    this.topKey = keys[0];
    const n = --this.n;
    if (n > 0) {

/* EP Simulator — beat morphology.
 *
 * Turns activation specs into ECG waveforms:
 *   ventricular spec → QRS dipole (from the voxel model) + ST-T from the ventricular-gradient rule
 *   atrial spec      → P wave dipole (from the atrial surface model)
 * Waveforms are vectorcardiograms sampled at 1 kHz: { n, pre, vcg:Float32Array(3n), adds }
 * where `pre` is the number of ms between sample 0 and the fiducial (first activation).
 */
(function (EP) {
  'use strict';
  const G = EP.G, M = EP.Model;
  const Mo = (EP.Morph = {});
  const A = (EP.Anatomy = EP.Anatomy || {});
  let ready = false;

  const T_NORMAL = [48.6, -33.9, 23.6];   // desired T-wave area vector of a normal beat (mV·ms)
  const KAPPA = 0.62;                     // how strongly the T opposes the QRS area (ventricular gradient rule)
  let GV = [0, 0, 0];                     // ventricular gradient (set during init)
  let NORMAL_AREA = 1;
  Mo.NORMAL_QRS = 92;

  Mo.init = function () {
    if (ready) return Mo;
    M.build();
    A.muscle = G.mesh(G.sdMuscle, G.BOUNDS.muscle, 0.28);
    const n = A.muscle.pos.length / 3, P = A.muscle.pos;
    A.region = new Uint8Array(n);
    for (let i = 0; i < n; i++) A.region[i] = G.region(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]);
    M.buildAtria(A.muscle, A.region);
    A.voxOfVert = M.mapMesh(A.muscle.pos, A.muscle.nrm, (i) => !G.isAtrial(A.region[i]), 0.3);
    const nb = Mo.vent(Mo.spec('normal'));
    NORMAL_AREA = Math.hypot(nb.area[0], nb.area[1], nb.area[2]);
    GV = [T_NORMAL[0] + KAPPA * nb.area[0], T_NORMAL[1] + KAPPA * nb.area[1], T_NORMAL[2] + KAPPA * nb.area[2]];
    Mo.NORMAL_QRS = nb.off - nb.on;
    ready = true;
    return Mo;
  };

  // ---- named sites (world points + which kind of voxel to snap to) ---------------------------
  const L = G.L;
  Mo.SITES = {
    rvApex: { p: L(3.3, 0.5, 6.6), kind: 'endoRV', name: 'RV apex' },
    rvMidSeptum: { p: L(2.95, 0.0, 3.4), kind: 'endoRV', name: 'RV mid-septum' },
    rvHighSeptum: { p: L(3.1, -1.2, 1.6), kind: 'endoRV', name: 'RV high septum' },
    rvotSeptal: { p: L(2.3, -3.4, 1.1), kind: 'any', name: 'RVOT (septal)' },
    rvotFree: { p: L(4.0, -3.5, 1.3), kind: 'any', name: 'RVOT (free wall)' },
    rvFreeWall: { p: L(6.0, 0.2, 3.0), kind: 'any', name: 'RV free wall' },
    rvInflow: { p: L(5.2, 2.0, 1.2), kind: 'any', name: 'RV inflow / tricuspid annulus' },
    moderator: { p: L(4.6, -0.4, 4.6), kind: 'endoRV', name: 'Moderator band', purkRV: 1 },
    lbbArea: { p: L(2.15, -0.2, 2.2), kind: 'purkLV', name: 'Left bundle branch area', purkLV: 1 },
    hisBundle: { p: G.LM.his, kind: 'any', name: 'His bundle' },
    lvotSeptal: { p: L(2.0, -1.3, 0.4), kind: 'any', name: 'LVOT / aortic cusp region' },
    lvSummit: { p: L(0.4, -3.0, 0.4), kind: 'epi', name: 'LV summit' },
    mitralAnt: { p: L(-0.8, -2.9, 0.3), kind: 'any', name: 'Anterior mitral annulus' },
    mitralLat: { p: L(-3.0, 0.0, 0.3), kind: 'any', name: 'Lateral mitral annulus' },
    mitralPost: { p: L(0.3, 2.95, 0.3), kind: 'any', name: 'Posterior mitral annulus' },
    papAL: { p: L(-1.6, -1.0, 4.4), kind: 'endoLV', name: 'Anterolateral papillary muscle' },
    papPM: { p: L(-0.6, 1.9, 4.4), kind: 'endoLV', name: 'Posteromedial papillary muscle' },
    fascPost: { p: L(1.5, 1.2, 4.6), kind: 'purkLV', name: 'Left posterior fascicle', purkLV: 1, purkLVant: 0.5, lobes: 'fascPost' },
    fascAnt: { p: L(0.9, -1.6, 3.6), kind: 'purkLV', name: 'Left anterior fascicle', purkLV: 1, purkLVpost: 0.5, lobes: 'fascAnt' },
    lvApex: { p: L(0.0, 0.2, 7.6), kind: 'any', name: 'LV apex' },
    lvLatEpi: { p: L(-3.05, 0.6, 2.6), kind: 'epi', name: 'LV lateral wall (epicardial / coronary vein)' },
    lvPostLat: { p: L(-2.3, 2.0, 2.0), kind: 'epi', name: 'LV posterolateral wall' },
    lvInfBase: { p: L(0.4, 3.0, 1.2), kind: 'any', name: 'LV inferobasal wall' },
    lvAntWall: { p: L(-0.6, -2.95, 3.4), kind: 'epi', name: 'LV anterior wall' },
    lvInfApical: { p: L(0.5, 2.2, 6.0), kind: 'any', name: 'LV inferoapical wall' },
    midCardiacVein: { p: L(1.6, 2.7, 3.2), kind: 'epi', name: 'Middle cardiac vein (posterior septum, epicardial)' },
  };

  /* His-Purkinje exits. o: { lbb, rbb, laf, lpf (false = blocked), t (ms offset), rbbDelay, lbbDelay } */
  Mo.hps = function (o) {
    o = o || {};
    const E = G.LM.exits, t = o.t || 0, s = [];
    if (o.lbb !== false) {
      const d = t + (o.lbbDelay || 0);
      if (o.laf !== false || o.lpf !== false) s.push({ p: E.lvSeptal, kind: 'purkLV', t: d + (o.laf === false ? 6 : 0) });
      if (o.laf !== false) s.push({ p: E.laf, kind: 'purkLV', t: d + 3 });
      if (o.lpf !== false) s.push({ p: E.lpf, kind: 'purkLV', t: d + 3 });
    }
    if (o.rbb !== false) {
      const d = t + (o.rbbDelay || 0);
      s.push({ p: E.rvSeptal, kind: 'purkRV', t: d + 8 }, { p: E.rvFree, kind: 'purkRV', t: d + 12 });
    }
    return s;
  };

  Mo.ECT = 0.34;      // Purkinje-layer factor when the network is only engaged retrogradely
  /* Hemiblock correction lobes. The uniform Purkinje sheet under-states how far a fascicular block swings
   * the frontal axis, so these two templates get a small additive dipole: [time ms, sigma ms, [x,y,z] mV]. */
  const LOBES = {
    lafb: { id: 'lafb', list: [[20, 9, [0.03, 0.38, 0.0]], [56, 13, [0.26, 0.5, -0.08]]] },
    lpfb: { id: 'lpfb', list: [[18, 8, [0.08, -0.3, 0.0]], [54, 13, [-0.34, -0.52, 0.03]]] },
    fascPost: { id: 'fp', list: [[26, 10, [0.0, 0.34, 0.0]], [70, 16, [0.14, 0.52, 0.07]], [104, 14, [-0.32, 0.07, 0.36]]] },
    fascAnt: { id: 'fa', list: [[24, 10, [0.07, -0.2, 0.0]], [66, 15, [-0.34, -0.42, 0.07]], [100, 14, [-0.25, 0.0, 0.36]]] },
  };
  Mo.siteSpec = function (st) {
    const sp = { seeds: [{ p: st.p, kind: st.kind, t: 0 }], purkLV: st.purkLV || Mo.ECT, purkRV: st.purkRV || Mo.ECT };
    if (st.purkLVant != null) sp.purkLVant = st.purkLVant;
    if (st.purkLVpost != null) sp.purkLVpost = st.purkLVpost;
    if (st.lobes) sp.lobes = LOBES[st.lobes];
    return sp;
  };
  /* Build a named ventricular activation spec.
   *  'normal' | 'rbbb' | 'lbbb' | 'lafb' | 'lpfb' | 'rbbb+lafb' | 'rbbb+lpfb' | 'ilbbb' | 'irbbb'
   *  { site: 'rvApex' | [x,y,z], kind } → focal beat from that site
   * opts.slow ≥ 1 scales all conduction (Na-channel block, hyperkalaemia). */
  Mo.spec = function (what, opts) {
    opts = opts || {};
    let sp;
    if (typeof what === 'string') {
      switch (what) {
        case 'normal': sp = { seeds: Mo.hps({}), purkLV: 1, purkRV: 1 }; break;
        case 'rbbb': sp = { seeds: Mo.hps({ rbb: false }), purkLV: 1, purkRV: 0.2 }; break;
        case 'irbbb': sp = { seeds: Mo.hps({ rbbDelay: 22 }), purkLV: 1, purkRV: 0.7 }; break;
        case 'lbbb': sp = { seeds: Mo.hps({ lbb: false }), purkLV: 0.2, purkRV: 1 }; opts = Object.assign({ slow: 1.1 }, opts); break;
        case 'ilbbb': sp = { seeds: Mo.hps({ lbbDelay: 24 }), purkLV: 0.7, purkRV: 1 }; break;
        case 'lafb': sp = { seeds: Mo.hps({ laf: false }), purkLV: 1, purkLVant: 0.5, purkRV: 1, lobes: LOBES.lafb }; break;
        case 'lpfb': sp = { seeds: Mo.hps({ lpf: false }), purkLV: 1, purkLVpost: 0.5, purkRV: 1, lobes: LOBES.lpfb }; break;
        case 'rbbb+lafb': sp = { seeds: Mo.hps({ rbb: false, laf: false }), purkLV: 1, purkLVant: 0.5, purkRV: 0.2, lobes: LOBES.lafb }; break;
        case 'rbbb+lpfb': sp = { seeds: Mo.hps({ rbb: false, lpf: false }), purkLV: 1, purkLVpost: 0.5, purkRV: 0.2, lobes: LOBES.lpfb }; break;
        default:
          if (Mo.SITES[what]) { const st = Mo.SITES[what]; sp = Mo.siteSpec(st); }
          else throw new Error('unknown morphology ' + what);
      }
    } else if (what.site) {
      const st = typeof what.site === 'string' ? Mo.SITES[what.site] : { p: what.site, kind: what.kind || 'any' };
      sp = Mo.siteSpec(st);
    } else sp = Object.assign({}, what);
    if (opts.purkLV != null) sp.purkLV = opts.purkLV;
    if (opts.purkRV != null) sp.purkRV = opts.purkRV;
    if (opts.slow && opts.slow !== 1) { sp.vm = M.VM / opts.slow; sp.vp = M.VP / opts.slow; }
    if (opts.aniso) sp.aniso = opts.aniso;
    return sp;
  };
  /* Combine specs into one activation (fusion): parts = [{spec, t}] */
  Mo.fuse = function (parts) {
    const seeds = []; let pl = 1, pr = 1, vm, vp;
    for (const q of parts) {
      for (const s of q.spec.seeds) seeds.push({ p: s.p, kind: s.kind, v: s.v, t: (s.t || 0) + (q.t || 0) });
      if (q.spec.vm) { vm = q.spec.vm; vp = q.spec.vp; }
    }
    // The Purkinje network is as good as the best-conducting contributor that actually uses it.
    pl = Math.max.apply(null, parts.map((q) => (q.spec.purkLV == null ? 1 : q.spec.purkLV)));
    pr = Math.max.apply(null, parts.map((q) => (q.spec.purkRV == null ? 1 : q.spec.purkRV)));
    const sp = { seeds, purkLV: pl, purkRV: pr };
    const reg = (k) => { let b = null; for (const q of parts) { const f = q.spec[k] != null ? q.spec[k] : (q.spec.purkLV == null ? 1 : q.spec.purkLV); b = b == null ? f : Math.max(b, f); } return b; };
    if (parts.some((q) => q.spec.purkLVant != null || q.spec.purkLVpost != null)) { sp.purkLVant = reg('purkLVant'); sp.purkLVpost = reg('purkLVpost'); }
    if (vm) { sp.vm = vm; sp.vp = vp; }
    const sc = parts.find((q) => q.spec.scar); if (sc) sp.scar = sc.spec.scar;
    return sp;
  };

  // ---- ventricular activation (cached) --------------------------------------------------------
  const vcache = new Map();
  function specKey(sp) {
    let k = (sp.purkLV == null ? 1 : sp.purkLV) + '|' + (sp.purkRV == null ? 1 : sp.purkRV) + '|' + (sp.purkLVant == null ? '' : sp.purkLVant) + '|' + (sp.purkLVpost == null ? '' : sp.purkLVpost) + '|' + (sp.vm || 0).toFixed(4) + '|' + (sp.aniso || 0) + '|' + (sp.lobes ? sp.lobes.id : '') + '|' + (sp.scar ? sp.scar.id + ':' + sp.scar.k.toFixed(2) : '');
    for (const s of sp.seeds) k += '|' + (s.v != null ? 'v' + s.v : s.p[0].toFixed(2) + ',' + s.p[1].toFixed(2) + ',' + s.p[2].toFixed(2) + (s.kind || '')) + '@' + Math.round((s.t || 0) * 2) / 2;
    return k;
  }
  Mo.vent = function (sp) {
    const key = specKey(sp);
    let r = vcache.get(key);
    if (r) { vcache.delete(key); vcache.set(key, r); return r; }
    const seeds = sp.seeds.map((s) => ({ v: s.v != null ? s.v : M.nearest(s.p, s.kind || 'any'), t: s.t || 0 }));
    const T = M.activate(seeds, sp);
    const d = M.dipole(T, sp.vm ? 3.2 * Math.min(3.2, M.VM / sp.vm) : 3.2, sp.scar ? sp.scar.w : null, sp.scar ? sp.scar.k : 0);   // slowed conduction: smooth proportionally
    if (sp.lobes) {
      const sc = sp.vm ? M.VM / sp.vm : 1;
      for (const lb of sp.lobes.list) {
        const c = lb[0] * sc - d.t0, sg = lb[1] * sc;
        for (let i = Math.max(0, Math.floor(c - 3 * sg)); i < Math.min(d.n, Math.ceil(c + 3 * sg)); i++) {
          const g = Math.exp(-0.5 * ((i - c) / sg) ** 2);
          d.vcg[i * 3] += lb[2][0] * g; d.vcg[i * 3 + 1] += lb[2][1] * g; d.vcg[i * 3 + 2] += lb[2][2] * g;
          d.area[0] += lb[2][0] * g; d.area[1] += lb[2][1] * g; d.area[2] += lb[2][2] * g;
        }
      }
    }
    // visible QRS onset / offset from the dipole magnitude
    let pk = 0;
    const mag = new Float32Array(d.n);
    for (let i = 0; i < d.n; i++) { mag[i] = Math.hypot(d.vcg[i * 3], d.vcg[i * 3 + 1], d.vcg[i * 3 + 2]); if (mag[i] > pk) pk = mag[i]; }
    let i0 = 0, i1 = d.n - 1;
    while (i0 < d.n && mag[i0] < pk * 0.035) i0++;
    while (i1 > 0 && mag[i1] < pk * 0.035) i1--;
    r = { T, vcg: d.vcg, n: d.n, t0: d.t0, tmin: d.tmin, tmax: d.tmax, area: d.area, on: d.t0 + i0, off: d.t0 + i1, peak: pk, key, seeds };
    vcache.set(key, r);
    if (vcache.size > 260) vcache.delete(vcache.keys().next().value);
    return r;
  };

  // ---- ST-T shapes ----------------------------------------------------------------------------
  function tShape(tau, p, sl, sr) {
    const d = tau - p;
    const g = Math.exp(-0.5 * (d / (d < 0 ? sl : sr)) ** 2);
    return g * EP.smoothstep(0, 0.1, tau) * (1 - EP.smoothstep(0.94, 1.0, tau));
  }
  function stPlateau(tau) { return EP.smoothstep(0, 0.045, tau) * (1 - EP.smoothstep(0.22, 0.68, tau)); }
  function stScoop(tau) { return EP.smoothstep(0, 0.06, tau) * Math.sin(Math.PI * Math.min(1, tau / 0.78)) * (1 - EP.smoothstep(0.6, 0.8, tau)); }

  /* Full ventricular complex. o: { rr (ms), mods } → waveform
   * mods: qtc, tAmp, tAdd[3] (mV·ms), tShape{p,sl,sr}, kappa, stFrac, st[3] (mV), stShape, u, jWave,
   *       leadAdd [{lead, fn(msFromJ, jt)}] */
  Mo.vbeat = function (sp, o) {
    o = o || {};
    const a = Mo.vent(sp), m = o.mods || {};
    const rr = EP.clamp(o.rr || 1000, 280, 1700);
    const qrs = a.off - a.on;
    const qtc = m.qtc || 412;
    const jt = EP.clamp((qtc - Mo.NORMAL_QRS) * Math.sqrt(rr / 1000) * (m.jtScale || 1), 110, 640);
    const pre = -a.t0;
    const jIdx = Math.round(a.off - a.t0);
    const tail = (m.u ? 300 : 40);
    const n = jIdx + Math.ceil(jt) + tail;
    const w = new Float32Array(3 * n);
    w.set(a.vcg.subarray(0, Math.min(a.vcg.length, 3 * n)));
    // --- T wave from the ventricular gradient ---
    const k = m.kappa == null ? KAPPA : m.kappa, ta = m.tAmp == null ? 1 : m.tAmp;
    const TA = [(GV[0] - k * a.area[0]) * ta, (GV[1] - k * a.area[1]) * ta, (GV[2] - k * a.area[2]) * ta];
    if (m.tAdd) { TA[0] += m.tAdd[0]; TA[1] += m.tAdd[1]; TA[2] += m.tAdd[2]; }
    const ts = m.tShape || {}, p = ts.p || 0.72, sl = ts.sl || 0.2, sr = ts.sr || 0.105;
    let integ = 0;
    const J = Math.ceil(jt);
    for (let i = 0; i < J; i++) integ += tShape(i / jt, p, sl, sr);
    const refInteg = 0.2 * 300 * 1.9;              // keeps T amplitude sane when JT gets very short
    const norm = 1 / Math.max(integ, refInteg * 0.45);
    const wide = EP.smoothstep(105, 150, qrs);
    const stPri = m.stFrac == null ? 0.03 : m.stFrac, stSec = m.stFrac == null ? 0.2 * wide : 0;
    const SA = [-k * a.area[0] * ta, -k * a.area[1] * ta, -k * a.area[2] * ta];
    const st = m.st || [0, 0, 0];
    const stFn = typeof m.stShape === 'function' ? m.stShape : m.stShape === 'scoop' ? stScoop : stPlateau;
    for (let i = 0; i < J; i++) {
      const tau = i / jt, q = (jIdx + i) * 3;
      // T wave; a small primary ST component; and, for wide beats, a secondary ST shift that is purely
      // opposite to the QRS area — so ST/S stays proportionate lead by lead ("appropriate discordance").
      const tv = tShape(tau, p, sl, sr) * norm, pl = stPlateau(tau) * norm, s2 = stFn(tau), sv = pl * stPri, ss = pl * stSec;
      w[q] += TA[0] * (tv + sv) + SA[0] * ss + st[0] * s2; w[q + 1] += TA[1] * (tv + sv) + SA[1] * ss + st[1] * s2; w[q + 2] += TA[2] * (tv + sv) + SA[2] * ss + st[2] * s2;
    }
    // --- U wave ---
    if (m.u) {
      const c = jIdx + jt + 95, sg = 46, amp = 0.11 * m.u, d = [0.72, -0.5, 0.42];
      for (let i = Math.max(0, Math.floor(c - 150)); i < n; i++) {
        const g = amp * Math.exp(-0.5 * ((i - c) / sg) ** 2), q = i * 3;
        w[q] += d[0] * g; w[q + 1] += d[1] * g; w[q + 2] += d[2] * g;
      }
    }
    // --- J (Osborn) wave ---
    if (m.jWave) {
      const c = jIdx + 14, sg = 13, d = [0.55, -0.62, 0.4];
      for (let i = Math.max(0, jIdx - 30); i < Math.min(n, jIdx + 70); i++) {
        const g = m.jWave * Math.exp(-0.5 * ((i - c) / sg) ** 2), q = i * 3;
        w[q] += d[0] * g; w[q + 1] += d[1] * g; w[q + 2] += d[2] * g;
      }
    }
    let adds = null;
    if (m.leadAdd) {
      adds = m.leadAdd.map((la) => {
        const data = new Float32Array(n);
        for (let i = Math.max(0, jIdx - 40); i < n; i++) data[i] = la.fn(i - jIdx, jt);
        return { lead: la.lead, data };
      });
    }
    return { n, pre, vcg: w, adds, qrsOn: a.on, qrsOff: a.off, qrs, jt, qt: (a.off - a.on) + jt, act: a };
  };

  // ---- atrial activation (cached) --------------------------------------------------------------
  const acache = new Map();
  Mo.ASITES = {
    sinus: { p: G.LM.saNode, name: 'Sinus node' },
    lowRA: { p: [-3.6, -2.4, -0.6], name: 'Low right atrium' },
    avn: { p: G.LM.avNode, name: 'AV node (retrograde)' },
    csOs: { p: G.LM.csOs, name: 'Coronary sinus ostium' },
    crista: { p: [-5.3, 0.2, -0.6], name: 'Crista terminalis' },
    raa: { p: G.LM.raa, name: 'Right atrial appendage' },
    lspv: { p: G.LM.pv.LSPV[0], name: 'Left superior pulmonary vein' },
    rspv: { p: G.LM.pv.RSPV[0], name: 'Right superior pulmonary vein' },
    lipv: { p: G.LM.pv.LIPV[0], name: 'Left inferior pulmonary vein' },
    laa: { p: G.LM.laa, name: 'Left atrial appendage' },
    laLateral: { p: [3.9, 0.6, -3.4], name: 'Lateral left atrium / mitral annulus' },
    laPostSeptal: { p: [0.6, -1.0, -4.2], name: 'Posteroseptal left atrium' },
  };
  Mo.atrial = function (sp) {
    // sp: { seeds: [{p|site, t}], speed }
    let key = 'a' + (sp.speed || 0);
    const pt = (s) => (typeof s.site === 'string' ? Mo.ASITES[s.site].p : (s.site || s.p));
    for (const s of sp.seeds) { const p = pt(s); key += '|' + p[0].toFixed(2) + ',' + p[1].toFixed(2) + ',' + p[2].toFixed(2) + '@' + (s.t || 0); }
    let r = acache.get(key);
    if (r) return r;
    const seeds = sp.seeds.map((s) => ({ v: M.nearestAtrial(pt(s)), t: s.t || 0 }));
    const T = M.atrialActivate(seeds, sp);
    const d = M.atrialDipole(T);
    r = { T, vcg: d.vcg, n: d.n, t0: d.t0, tmin: d.tmin, tmax: d.tmax, dur: d.dur, key };
    acache.set(key, r);
    if (acache.size > 80) acache.delete(acache.keys().next().value);
    return r;
  };
  /* P wave waveform. o: { amp } */
  Mo.pwave = function (sp, o) {
    o = o || {};
    const a = Mo.atrial(sp), amp = o.amp == null ? 1 : o.amp;
    const ext = o.prDep ? 110 : 0, n = a.n + ext;
    const w = new Float32Array(n * 3);
    for (let i = 0; i < a.vcg.length; i++) w[i] = a.vcg[i] * amp;
    if (o.prDep) {
      // atrial injury (pericarditis): PR-segment depression along the P axis
      const d = [0.5, -0.62, 0.32], i0 = Math.round(a.tmax - a.t0) - 10;
      for (let i = Math.max(0, i0); i < n; i++) { const g = -o.prDep * EP.smoothstep(i0, i0 + 25, i) * (1 - EP.smoothstep(n - 22, n - 2, i)); w[i * 3] += d[0] * g; w[i * 3 + 1] += d[1] * g; w[i * 3 + 2] += d[2] * g; }
    }
    return { n, pre: -a.t0, vcg: w, adds: null, dur: a.dur, act: a };
  };

    { id: 'afib-rvr', group: 'sinus', name: 'Atrial fibrillation, rapid response', sub: '≈ 150/min', focus: 'A', view: 'back',
      cfg: () => ({ sinus: { on: false }, atria: { mode: 'fib', fibMean: 135 }, avn: { fast: { erp: 255, conceal: 0.3, min: 60 } } }),
      teach: { mech: 'Pulmonary-vein triggers launch multiple wandering wavelets / rotors; the atria never contract as a unit. 350–600 impulses a minute bombard the AV node. Most die inside it, and each one that partly penetrates leaves it refractory for the next (concealed conduction) — which is why the ventricular response is random.',
        ecg: ['No P waves; fibrillatory baseline best seen in V1 and II.', 'Irregularly irregular R-R intervals.', 'Narrow QRS unless bundle branch block, aberrancy (Ashman beats after a long-short sequence) or pre-excitation.'],
        pearls: ['Unstable (hypotension, ischaemia, pulmonary oedema) → synchronised cardioversion 120–200 J biphasic.', 'Stable → rate control: beta-blocker or diltiazem; in decompensated HFrEF prefer amiodarone or digoxin.', 'Onset > 48 h or unknown and not anticoagulated: rhythm control carries stroke risk — anticoagulate / TEE first unless unstable.', 'Irregular AND wide AND very fast (> 200) → think pre-excited AF: no AV-nodal blockers.'] } },
    { id: 'afib-cvr', group: 'sinus', name: 'Atrial fibrillation, controlled', sub: '≈ 75/min', focus: 'A', view: 'back',
      cfg: () => ({ sinus: { on: false }, atria: { mode: 'fib', fibMean: 150, fibAmp: 0.8 }, avn: { fast: { erp: 470, conceal: 0.2, min: 80 } } }),
      teach: { mech: 'Same atrial chaos; the AV node filters more of it (drug effect, intrinsic conduction disease or high vagal tone).',
        ecg: ['Irregularly irregular rhythm, no P waves, ventricular rate 60–100.', 'A slow, perfectly regular ventricular rate in AF means complete AV block with a junctional or ventricular escape — think digoxin toxicity.'],
        pearls: ['Target resting rate < 110 (lenient) unless symptoms demand tighter control.', 'Stroke prevention is driven by CHA₂DS₂-VASc, not by whether the rhythm is controlled.'] } },
    { id: 'flutter-21', group: 'sinus', name: 'Typical atrial flutter, 2:1', sub: 'atria 290, ventricles 145', focus: 'A', view: 'flutter',
      cfg: () => ({ sinus: { on: false }, atria: { mode: 'flutter', flutterCL: 207 }, avn: { fast: { erp: 290, conceal: 0.3 } } }),
      teach: { mech: 'A single macro-re-entrant wave circles the tricuspid annulus counter-clockwise (viewed from the ventricle): up the septum, over the roof, down the lateral wall, then through the cavotricuspid isthmus — the narrow corridor between the IVC and the tricuspid valve. The crista terminalis and the annulus are the barriers that hold the circuit together. The left atrium is a passive bystander.',
        ecg: ['Sawtooth flutter waves at ≈ 300/min, negative in II, III, aVF with no isoelectric baseline; positive in V1.', '2:1 conduction gives a regular narrow tachycardia at ≈ 150/min — every other flutter wave hides in the QRS/T.', 'Turn the ECG upside down or look at V1 if you cannot see them.'],
        pearls: ['A regular narrow-complex tachycardia at exactly 150/min is flutter until proven otherwise.', 'Adenosine or vagal manoeuvres do not terminate it but unmask the flutter waves.', 'Very responsive to low-energy synchronised cardioversion (50–100 J). Rate control is harder than in AF.', 'The cavotricuspid isthmus is the ablation target — a single line of block cures it.', 'Class Ic drugs slow the circuit and can allow 1:1 conduction — always give an AV-nodal blocker with them.'] } },
    { id: 'flutter-41', group: 'sinus', name: 'Atrial flutter, 4:1', sub: 'ventricles ≈ 72', focus: 'A', view: 'flutter',
      cfg: () => ({ sinus: { on: false }, atria: { mode: 'flutter', flutterCL: 207 }, avn: { fast: { erp: 520, conceal: 0.25 } } }),
      teach: { mech: 'The same right-atrial circuit with more AV-nodal filtering. Even ratios (2:1, 4:1) are the rule because block occurs at two levels in the node.',
        ecg: ['Flutter waves are obvious between the widely spaced QRS complexes.', 'Regular ventricular rhythm at ≈ 75/min; flutter-to-R relationship is constant.'],
        pearls: ['Carries the same stroke risk as AF — anticoagulate by CHA₂DS₂-VASc.', 'Variable block gives an irregular rhythm that can pass for AF: look for the repeating sawtooth.'] } },
    { id: 'flutter-cw', group: 'sinus', name: 'Reverse typical flutter', sub: 'clockwise, 2:1', focus: 'A', view: 'flutter',
      cfg: () => ({ sinus: { on: false }, atria: { mode: 'flutter', flutterCL: 215, flutterDir: 'cw' }, avn: { fast: { erp: 300, conceal: 0.3 } } }),
      teach: { mech: 'The same cavotricuspid-isthmus-dependent circuit travelling the opposite way round the tricuspid annulus (down the septum, up the lateral wall).',
        ecg: ['Broad positive, often notched flutter waves in the inferior leads; negative in V1.', 'Same rate and same response to drugs as counter-clockwise flutter.'],
        pearls: ['Same ablation target (the isthmus). Flutter that does not fit either pattern ("atypical") usually circles a scar or the mitral annulus — common after AF ablation or cardiac surgery.'] } },

    // ------------------------------------------------------------------ SVT
    { id: 'avnrt', group: 'svt', name: 'AVNRT (typical, slow-fast)', sub: '≈ 180/min, initiation by a PAC', focus: 'AV', view: 'koch',
      cfg: () => ({ sinus: { cl: 850, resp: 0 }, avn: { fast: { erp: 365 }, slow: { min: 205, alpha: 150, tau: 80, erp: 235, conceal: 0, retro: { delay: 200, erp: 330, block: false } } },
        foci: [PAC({ coupling: 305, every: 4, site: 'crista', count: 1 })] }),
      teach: { mech: 'Two inputs to the AV node: a FAST pathway (anterior, conducts quickly, long refractory period) and a SLOW pathway (posterior, near the coronary sinus os; conducts slowly, recovers quickly). A critically timed PAC finds the fast pathway refractory and goes down the slow one — the PR suddenly jumps. By the time it reaches the bottom the fast pathway has recovered, so the impulse returns up it to the atria while also descending to the ventricles. Atria and ventricles are activated almost simultaneously, every cycle.',
        ecg: ['Regular narrow-complex tachycardia, usually 150–220/min, abrupt onset after a PAC with a long PR.', 'No visible P wave, or a retrograde P fused to the end of the QRS: pseudo-r′ in V1, pseudo-S in II, III, aVF. Compare with the sinus QRS.', 'RP < 70 ms.'],
        pearls: ['Vagal manoeuvres (modified Valsalva with leg raise) then adenosine 6 mg → 12 mg by rapid flush. Both block the AV node, which is part of the circuit, so they terminate it.', 'Unstable → synchronised cardioversion 50–100 J.', 'Slow-pathway ablation is curative (> 95%) with ≈ 0.5–1% risk of AV block.', 'Neck pounding ("frog sign") — atria contracting against closed AV valves.'] } },
    { id: 'avnrt-atyp', group: 'svt', name: 'AVNRT (atypical, fast-slow)', sub: 'long RP, initiation by a PVC', focus: 'AV', view: 'koch',
      cfg: () => ({ sinus: { cl: 880, resp: 0 }, avn: { fast: { retro: { block: true } }, slow: { min: 420, alpha: 0, erp: 250, conceal: 0, retro: { delay: 285, erp: 200, block: false } } },
        foci: [PVC({ coupling: 300, every: 3, count: 1, site: 'rvApex' })] }),
      teach: { mech: 'The circuit runs the other way: down the fast pathway, back up the slow pathway. Because the retrograde limb is slow, the atria are activated late — the P wave lands well after the QRS, just before the next one.',
        ecg: ['Regular narrow tachycardia with inverted P waves in II, III, aVF before each QRS: RP > PR (long-RP tachycardia).', 'Often started by a PVC rather than a PAC.'],
        pearls: ['Differential of long-RP tachycardia: atrial tachycardia, atypical AVNRT, and AVRT using a slowly conducting pathway (PJRT).', 'Adenosine terminating the tachycardia with a P wave (block in the node after atrial activation) argues against atrial tachycardia.'] } },
    { id: 'avrt', group: 'svt', name: 'Orthodromic AVRT', sub: 'left lateral pathway, ≈ 195/min', focus: 'AV', view: 'base',
      cfg: (o) => ({ sinus: { cl: 850, resp: 0 }, avn: { fast: { erp: 250, min: 62, alpha: 300, tau: 110 } }, ap: R.apCfg((o && o.ap) || 'leftLateral', { erp: 335, retro: { delay: 28, erp: 220 } }),
        foci: [PAC({ coupling: 298, every: 4, site: 'crista', count: 1 })] }),
      teach: { mech: 'A macro-re-entrant circuit using normal tissue and an accessory pathway (AP): atrium → AV node → His-Purkinje → ventricle → back up the AP → atrium. The PAC blocks in the AP (longer refractory period) and conducts over the node alone, so the delta wave disappears; by the time the ventricles are activated the AP has recovered and carries the impulse back.',
        ecg: ['In sinus rhythm: short PR and delta wave (subtle with a left lateral pathway, which is far from the sinus node).', 'Tachycardia: regular, NARROW (no delta — the ventricles are activated over the normal system).', 'Retrograde P in the ST segment, RP > 70 ms but < PR. With a left lateral AP the P is negative in I and aVL.', 'QRS alternans and rate-related ST depression are common.'],
        pearls: ['Because the AV node is in the circuit: vagal manoeuvres, adenosine, verapamil/diltiazem or beta-blocker terminate it.', 'Bundle branch block on the same side as the pathway lengthens the circuit and SLOWS the tachycardia (Coumel\'s sign) — try the control.', 'After adenosine, 1–15% develop AF; with a manifest pathway have a defibrillator ready.'],
        controls: [{ key: 'ap', label: 'Pathway', type: 'select', options: Object.keys(R.AP).map((k) => [k, R.AP[k].name]), def: 'leftLateral' }] } },
    { id: 'avrt-anti', group: 'svt', name: 'Antidromic AVRT', sub: 'wide, regular, ≈ 190/min', focus: 'AV', view: 'base',
      cfg: () => ({ sinus: { cl: 850, resp: 0 }, avn: { fast: { erp: 345, min: 62, retro: { delay: 62, erp: 200 } } }, hps: { retro: { delay: 55, erp: 200 } }, ap: R.apCfg('rightFreeWall', { erp: 230, retro: { delay: 28, erp: 600, block: true } }),
        foci: [PAC({ coupling: 300, every: 4, site: 'crista', count: 1 })] }),
      teach: { mech: 'The same circuit in reverse: down the accessory pathway, back up the His-Purkinje system and AV node. The ventricles are activated entirely from the pathway insertion, cell-to-cell, so the QRS is maximally pre-excited and wide.',
        ecg: ['Regular wide-complex tachycardia; QRS looks like an exaggerated version of the delta wave in sinus rhythm.', 'Indistinguishable from VT on a single ECG in many cases; 1:1 VA relationship.'],
        pearls: ['Uncommon (≈ 5% of AVRT). When in doubt, treat a regular wide-complex tachycardia as VT.', 'Stable: procainamide; adenosine may terminate it but only use it if you are certain the rhythm is regular.'] } },
    { id: 'wpw', group: 'svt', name: 'Pre-excitation (WPW pattern)', sub: 'sinus rhythm with delta wave', focus: 'AV', view: 'base',
      cfg: (o) => ({ sinus: { cl: 850 }, ap: R.apCfg((o && o.ap) || 'rightFreeWall') }),
      teach: { mech: 'An accessory pathway — a strand of working myocardium bridging the AV ring — conducts without the AV-nodal delay. Part of the ventricle is activated early, cell-to-cell, from the pathway insertion (delta wave); the rest is activated normally when the His-Purkinje impulse arrives. Every beat is a fusion beat.',
        ecg: ['PR < 120 ms, slurred QRS upstroke (delta wave), QRS > 110 ms, secondary ST-T changes.', 'Delta-wave polarity points AWAY from the pathway: left lateral → negative in I, aVL, positive V1; posteroseptal → negative in III, aVF; right free wall → negative V1, left axis.', 'Pre-excitation is greater the closer the pathway is to the sinus node and the slower the AV node.'],
        pearls: ['Can mimic MI (negative delta = pseudo-Q), LVH and bundle branch block.', 'Pattern + symptoms = WPW syndrome. Sudden loss of the delta wave on exercise suggests a long refractory period (lower risk).', 'Switch the pathway location to see the 12-lead change, then test yourself in the Localisation lab.'],
        controls: [{ key: 'ap', label: 'Pathway', type: 'select', options: Object.keys(R.AP).map((k) => [k, R.AP[k].name]), def: 'rightFreeWall' }] } },
    { id: 'wpw-af', group: 'svt', name: 'Pre-excited atrial fibrillation', sub: 'fast, broad, irregular', focus: 'AV', view: 'base',
      cfg: () => ({ sinus: { on: false }, atria: { mode: 'fib', fibMean: 120 }, avn: { fast: { erp: 330, conceal: 0.4 } }, ap: R.apCfg('leftLateral', { erp: 215 }) }),
      teach: { mech: 'AF in someone with an accessory pathway. The AV node protects the ventricles by decremental conduction; the pathway does not. Impulses reach the ventricles over both routes in varying proportion, so the QRS width changes beat to beat, and the shortest R-R interval reflects the pathway\'s refractory period.',
        ecg: ['Irregularly irregular, very fast (often > 200/min, shortest R-R < 250 ms).', 'QRS complexes of varying width and shape — more pre-excited when shorter cycles favour the pathway.', 'The axis and bundle-branch pattern stay constant (unlike polymorphic VT).'],
        pearls: ['AV-nodal blockers (adenosine, verapamil, diltiazem, digoxin, IV beta-blocker, and IV amiodarone) remove the node\'s competition and concealed retrograde penetration of the pathway → faster pre-excited rates → VF.', 'Unstable → immediate synchronised cardioversion. Stable → procainamide or ibutilide, or cardiovert.', 'Shortest pre-excited R-R ≤ 250 ms marks a high-risk pathway → ablation.'] } },
    { id: 'junctional', group: 'svt', name: 'Junctional rhythm', sub: '48/min with retrograde P', focus: 'AV', view: 'koch',
      cfg: () => ({ sinus: { cl: 1900, startAt: 5000 }, avn: { fast: { retro: { delay: 105, erp: 280 } } }, foci: [{ id: 'j', node: 'H', cl: 1250, label: 'junctional', startAt: 300 }] }),
      teach: { mech: 'The sinus node has slowed or failed and a subsidiary pacemaker in the AV junction (His bundle region) takes over at its intrinsic 40–60/min. The impulse travels down the normal His-Purkinje system (narrow QRS) and backwards into the atria (retrograde P).',
        ecg: ['Regular narrow QRS at 40–60/min.', 'P waves inverted in II, III, aVF and may fall before (short PR), within or after the QRS depending on relative antegrade and retrograde conduction times.'],
        pearls: ['An escape rhythm is a safety net — never suppress it. Find out why the sinus node is not firing (drugs, ischaemia, sick sinus).', '60–100/min = accelerated junctional rhythm (digoxin toxicity, post-surgery, myocarditis, inferior MI).'] } },

    // ------------------------------------------------------------------ AV block
    { id: 'avb1', group: 'block', name: 'First-degree AV block', sub: 'PR 300 ms', focus: 'AV', view: 'koch',
      cfg: () => ({ sinus: { cl: 900 }, avn: { fast: { min: 188 } } }),
      teach: { mech: 'Every impulse conducts, but slowly — usually within the AV node. "Block" is a misnomer; it is delay.',
        ecg: ['PR > 200 ms and constant; every P followed by a QRS.', 'With a narrow QRS the delay is nodal; with bundle branch block it may be infranodal.'],
        pearls: ['Benign in isolation. PR > 300 ms can cause symptoms from atrial contraction against closed valves.', 'Combined with bifascicular block it signals advanced conduction disease.'] } },
    { id: 'wenck', group: 'block', name: 'Second-degree, Mobitz I (Wenckebach)', sub: '4:3 conduction', focus: 'AV', view: 'koch',
      cfg: () => ({ sinus: { cl: 800, sd: 0, resp: 0 }, avn: { fast: { min: 70, alpha: 3219, tau: 197, erp: 250, erpExit: 615 } } }),
      teach: { mech: 'The AV node is decremental: the less time it has had to recover, the slower it conducts. Each beat arrives a little earlier in the node\'s recovery, so conducts a little slower, until one arrives too early and is blocked. The pause lets the node recover and the cycle restarts. The ladder diagram shows the AV lines leaning further each beat.',
        ecg: ['PR lengthens progressively, then a P wave is not conducted.', 'The biggest PR increment is the second beat of the cycle, so the R-R intervals SHORTEN before the pause.', 'Grouped beating; the pause is less than two P-P intervals; PR after the pause is the shortest.'],
        pearls: ['Level is almost always the AV node: narrow QRS, improves with exercise or atropine, worsens with carotid massage.', 'Usually benign (sleep, athletes, inferior MI, AV-nodal drugs). Pace only for symptoms.'] } },
    { id: 'mobitz2', group: 'block', name: 'Second-degree, Mobitz II', sub: '3:2, infranodal', focus: 'AV', view: 'koch',
      cfg: () => ({ sinus: { cl: 830, sd: 0.005, resp: 0 }, hps: { blockN: 3, pattern: 'rbbb+lafb' } }),
      teach: { mech: 'All-or-none failure in the His-Purkinje system, which does not conduct decrementally. One bundle is already blocked; the other fails intermittently. There is no warning — the PR is the same before and after the dropped beat.',
        ecg: ['Constant PR on conducted beats, then a sudden non-conducted P.', 'QRS is usually wide (pre-existing bundle branch / bifascicular block).', 'The pause equals exactly two P-P intervals.'],
        pearls: ['Unstable and unpredictable: can progress to complete block with a slow or absent escape. Pacemaker indicated even if asymptomatic.', 'Atropine may WORSEN it — a faster sinus rate presents more impulses to diseased His-Purkinje tissue. Exercise also worsens it; carotid massage may improve it.', 'Have transcutaneous pads on; isoprenaline/epinephrine infusion or transvenous pacing as a bridge.'] } },
    { id: 'avb21', group: 'block', name: '2:1 AV block', sub: 'cannot be typed from one strip', focus: 'AV', view: 'koch',
      cfg: () => ({ sinus: { cl: 760, sd: 0.004, resp: 0 }, avn: { fast: { erp: 800, conceal: 0.25, min: 96 } } }),
      teach: { mech: 'Every other P wave is blocked. With only one conducted PR between drops you cannot tell progressive prolongation (Mobitz I) from fixed (Mobitz II).',
        ecg: ['Two P waves per QRS, regular. The non-conducted P often sits on the T wave — easily missed and misread as sinus bradycardia.', 'Clues to level: narrow QRS and long PR → nodal; wide QRS and normal PR → infranodal.'],
        pearls: ['Get a long strip: any 3:2 sequence reveals the type. Atropine/exercise improving conduction → nodal; worsening → infranodal.', 'Halving of a previously normal sinus rate should prompt a search for hidden P waves.'] } },
    { id: 'chb-j', group: 'block', name: 'Complete heart block, junctional escape', sub: 'atria 80, ventricles 44, narrow', focus: 'AV', view: 'koch',
      cfg: () => ({ sinus: { cl: 750, resp: 0.01 }, avn: { fast: { block: true, retro: { block: true } } }, foci: [{ id: 'j', node: 'H', cl: 1360, label: 'junctional', startAt: 500 }] }),
      teach: { mech: 'No atrial impulse reaches the ventricles; block is within the AV node, so a junctional pacemaker just below it rescues the ventricles with a narrow QRS at 40–60/min.',
        ecg: ['P waves and QRS complexes are each regular but unrelated (AV dissociation): the PR changes continuously and P waves march through the QRS and T.', 'Atrial rate > ventricular rate.'],
        pearls: ['Nodal-level block: escape is reasonably reliable and may respond to atropine. Causes: inferior MI, Lyme disease, drugs, post-TAVR/surgery, congenital.', 'Still usually needs pacing if not reversible.'] } },
    { id: 'chb-v', group: 'block', name: 'Complete heart block, ventricular escape', sub: 'ventricles 33, wide', focus: 'AV', view: 'koch',
      cfg: () => ({ sinus: { cl: 720, resp: 0.01 }, hps: { block: true }, foci: [{ id: 'v', node: 'V', cl: 1820, site: 'fascPost', label: 'escape', startAt: 400, sd: 0.02 }] }),
      teach: { mech: 'Block below the His bundle. The only rescue is a ventricular pacemaker in the distal Purkinje system or myocardium: slow (20–40/min), wide and unreliable.',
        ecg: ['AV dissociation with atrial rate much faster than a slow, wide-complex ventricular rhythm.', 'Escape morphology shows where it comes from (RBBB pattern → left ventricle).', 'Long pauses may trigger pause-dependent torsades.'],
        pearls: ['Atropine is unlikely to help — the problem is below the node. Go straight to pacing: transcutaneous now, transvenous as a bridge, permanent system as definitive.', 'Epinephrine or isoprenaline can speed the escape while you set up.', 'This is the patient who arrests with Stokes-Adams attacks.'] } },

    // ------------------------------------------------------------------ bundle branch
    { id: 'rbbb', group: 'ivcd', name: 'Right bundle branch block', sub: '', focus: 'V', view: 'front',
      cfg: () => ({ hps: { pattern: 'rbbb' } }),
      teach: { mech: 'Septum and left ventricle activate normally over the left bundle. The right ventricle is then reached late, cell-to-cell across the septum — an unopposed terminal vector pointing right and anterior.',
        ecg: ['QRS ≥ 120 ms. rSR′ ("M") in V1–V2; wide slurred S in I and V6.', 'The first 60–80 ms are normal, so axis and Q waves can still be interpreted.', 'Secondary T inversion in V1–V3 is expected; ST elevation there is not.'],
        pearls: ['Common in healthy people; new RBBB with dyspnoea → consider PE; with chest pain → proximal LAD occlusion.', 'Watch the 3D map: the RV free wall is the last to turn.'] } },
    { id: 'lbbb', group: 'ivcd', name: 'Left bundle branch block', sub: '', focus: 'V', view: 'front',
      cfg: () => ({ hps: { pattern: 'lbbb' } }),
      teach: { mech: 'Activation starts in the right ventricle and must cross the septum right-to-left through working muscle, then spread slowly round the left ventricle; the lateral wall is last. The whole sequence — including the first 40 ms — is abnormal.',
        ecg: ['QRS ≥ 120 ms (often ≥ 140). Broad notched R in I, aVL, V5–V6 with no septal q; deep QS or rS in V1–V3.', 'Discordant ST-T: ST elevation and upright T in V1–V3, ST depression and T inversion laterally — the T opposes the QRS.', 'Concordant ST elevation ≥ 1 mm, concordant ST depression V1–V3, or ST/S ratio ≤ −0.25 (modified Sgarbossa) → acute MI.'],
        pearls: ['Always pathological: cardiomyopathy, hypertension, aortic valve disease, conduction disease.', 'Dyssynchrony: the lateral wall contracts against an already relaxing septum. This is what CRT and left bundle area pacing correct.', 'A catheter bumping the right bundle in someone with LBBB causes complete heart block.'] } },
    { id: 'lafb', group: 'ivcd', name: 'Left anterior fascicular block', sub: 'left axis deviation', focus: 'V', view: 'front',
      cfg: () => ({ hps: { pattern: 'lafb' } }),
      teach: { mech: 'The left bundle fans into an anterior-superior fascicle and a posterior-inferior one. With the anterior fascicle blocked, activation begins inferiorly and sweeps upward and leftward to reach the anterolateral wall last.',
        ecg: ['Left axis deviation (−45° to −90°): qR in I and aVL, rS in II, III, aVF.', 'QRS < 120 ms; delayed R-peak time in aVL; often poor R-wave progression.'],
        pearls: ['The commonest fascicular block (thin fascicle, single blood supply). Exclude inferior MI as the cause of left axis.'] } },
    { id: 'lpfb', group: 'ivcd', name: 'Left posterior fascicular block', sub: 'right axis deviation', focus: 'V', view: 'front',
      cfg: () => ({ hps: { pattern: 'lpfb' } }),
      teach: { mech: 'The mirror image: activation starts antero-superiorly and sweeps down and rightward to the inferoposterior wall.',
        ecg: ['Right axis deviation (+90° to +180°): rS in I and aVL, qR in III and aVF.', 'QRS < 120 ms.'],
        pearls: ['Rare in isolation — a diagnosis of exclusion after RVH, lateral MI, PE and a vertical heart.'] } },
    { id: 'bifasc', group: 'ivcd', name: 'Bifascicular block', sub: 'RBBB + LAFB', focus: 'V', view: 'front',
      cfg: () => ({ hps: { pattern: 'rbbb+lafb' } }),
      teach: { mech: 'Two of the three fascicles are blocked; AV conduction depends on the remaining left posterior fascicle.',
        ecg: ['RBBB morphology in V1 with left axis deviation in the limb leads.', 'Add a long PR and it is loosely called "trifascicular block" — the PR delay may be in the last fascicle or the node.'],
        pearls: ['Syncope + bifascicular block = intermittent complete heart block until proven otherwise.', 'This is the substrate from which Mobitz II and infranodal complete block arise.'] } },

    // ------------------------------------------------------------------ ventricular
    { id: 'pvc', group: 'vent', name: 'PVCs (RVOT)', sub: 'with compensatory pause', focus: 'V', view: 'front',
      cfg: () => ({ sinus: { cl: 860, resp: 0 }, avn: NOVA, foci: [PVC({ coupling: 440, every: 3, site: 'rvotSeptal' })] }),
      teach: { mech: 'A ventricular focus fires early. Activation spreads cell-to-cell from that point instead of through the Purkinje network: slow, so the QRS is wide; and the vector points away from the origin, which is how the 12-lead localises it. The sinus node is not reset, so the next sinus P arrives on time but finds the ventricle refractory.',
        ecg: ['Early, wide (> 120 ms) QRS not preceded by a P wave, with a T wave opposite to the QRS.', 'Fully compensatory pause: the interval spanning the PVC equals two sinus cycles.', 'RVOT origin: LBBB pattern in V1 (starts in the right ventricle) with tall R waves in II, III, aVF (starts at the top).'],
        pearls: ['Outflow-tract PVCs in a structurally normal heart are benign; > 10–15% burden can cause a reversible cardiomyopathy.', 'Open the Localisation lab to move the focus round the heart.'] } },
    { id: 'bigeminy', group: 'vent', name: 'Ventricular bigeminy', sub: 'every other beat', focus: 'V', view: 'front',
      cfg: () => ({ sinus: { cl: 900, resp: 0 }, avn: NOVA, foci: [PVC({ coupling: 430, every: 1, site: 'lvotSeptal' })] }),
      teach: { mech: 'Each sinus beat is followed by a PVC at a fixed coupling interval (re-entry or triggered activity linked to the preceding beat). The long pause after each PVC favours the next one — "the rule of bigeminy".',
        ecg: ['Alternating narrow and wide complexes with fixed coupling.', 'The PVC may not generate a pulse: the palpated or oximeter rate can be half the ECG rate.'],
        pearls: ['"Bradycardia" on the pulse oximeter with a normal monitor rate = non-perfusing bigeminy.', 'Check potassium, magnesium, QT, ischaemia and digoxin.'] } },
    { id: 'nsvt', group: 'vent', name: 'Couplets & non-sustained VT', sub: 'multifocal', focus: 'V', view: 'front',
      cfg: () => ({ sinus: { cl: 820, resp: 0 }, avn: NOVA, foci: [PVC({ id: 'a', coupling: 420, every: 5, site: 'lvInfBase', repeat: 5, cl: 330 }), PVC({ id: 'b', coupling: 470, every: 3, site: 'rvFreeWall', repeat: 2, cl: 400 })] }),
      teach: { mech: 'Repetitive firing from ventricular foci. Different QRS shapes mean different exit sites.',
        ecg: ['Couplet = 2, triplet = 3; ≥ 3 consecutive at > 100/min lasting < 30 s = non-sustained VT.', 'More than one PVC morphology = multifocal.'],
        pearls: ['Prognosis depends on the heart it happens in: with reduced EF or scar it predicts sudden death; with a normal heart it usually does not.', 'Correct K⁺ (> 4.0) and Mg²⁺ (> 2.0); look for ischaemia and QT-prolonging drugs.'] } },
    { id: 'vt', group: 'vent', name: 'Monomorphic VT (scar-related)', sub: '180/min, AV dissociation', focus: 'V', view: 'left',
