<!doctype html><meta charset="utf-8"><title>dev stemi</title>
<style>body{margin:12px;font:13px sans-serif;background:#fff} .w{margin-bottom:8px} canvas{display:block}</style>
<div id="root"></div>
<script>window.THREE=undefined</script>
<script src="../js/util.js"></script><script src="../js/geometry.js"></script><script src="../js/model.js"></script>
<script src="../js/morph.js"></script><script src="../js/heartsim.js"></script><script src="../js/synth.js"></script>
<script src="../js/rhythms.js"></script><script src="../js/ischemia.js"></script><script src="../js/device.js"></script><script src="../js/ecgview.js"></script><script src="../js/ui.js"></script><script src="../js/ui-stemi.js"></script>
<script>
const q = new URLSearchParams(location.search), items = (q.get('id') || 'ladProx:0.36').split(',');
for (const it of items) {
  const [id, s] = it.split(':'), t = EP.Stemi.byId[id];
  const rec = EP.Stemi.record(t, s ? +s : 0.36);
  const d = document.createElement('div'); d.className = 'w';
  d.innerHTML = '<b>' + t.name + '</b> ' + (s || '') + '<div><canvas></canvas></div>';
  document.getElementById('root').appendChild(d);
  new EP.ECGView(d.querySelector('canvas'), { layout: '12', strips: [], rowMm: 21 }).setRecording(rec);
}
</script>
